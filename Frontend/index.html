<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Store | Premium E-Commerce</title>
    <meta name="description" content="A premium E-Commerce platform for modern shopping.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="container hero-content">
                <div class="hero-text">
                    <h1 class="hero-title">Experience the Future of <span class="gradient-text">Shopping</span></h1>
                    <p class="hero-subtitle">Discover premium products curated just for you. Seamless, elegant, and fast.</p>
                    <a href="products.html" class="btn btn-primary btn-glow">Shop Now</a>
                </div>
            </div>
            <!-- Slider or Animated Element Background -->
            <div class="hero-bg-glow"></div>
        </section>

        <!-- Categories Section -->
        <section class="categories-section container">
            <div class="section-header">
                <h2>Shop by Category</h2>
                <a href="categories.html" class="link-more">View All</a>
            </div>
            <div id="categories-grid" class="grid-layout skeleton-container">
                <!-- Skeleton loader -->
                <div class="skeleton card-skeleton"></div>
                <div class="skeleton card-skeleton"></div>
                <div class="skeleton card-skeleton"></div>
                <div class="skeleton card-skeleton"></div>
            </div>
        </section>

        <!-- Featured Products Section -->
        <section class="products-section container">
            <div class="section-header">
                <h2>Featured Products</h2>
                <a href="products.html" class="link-more">View All</a>
            </div>
            <div id="featured-products" class="grid-layout skeleton-container">
                <!-- Skeleton loader -->
                <div class="skeleton card-skeleton"></div>
                <div class="skeleton card-skeleton"></div>
                <div class="skeleton card-skeleton"></div>
                <div class="skeleton card-skeleton"></div>
            </div>
        </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Core Scripts -->
    <script src="assets/js/utils/storage.js"></script>
    <script src="assets/js/utils/authUtils.js"></script>
    <script src="assets/js/api/api.js"></script>
    <script src="assets/js/components/navbar.js"></script>
    <script src="assets/js/components/footer.js"></script>
    <script src="assets/js/components/toast.js"></script>
    <script src="assets/js/pages/home.js"></script>
</body>
</html>
